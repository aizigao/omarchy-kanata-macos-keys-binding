<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
  <title id="title">复制粘贴流程：Omarchy 通用路径与 Zed 专用路径</title>
  <desc id="desc">普通应用及独立终端：物理左 Alt 加 C 或 V，经 Kanata 输出 Super 加 C 或 V，再由 Omarchy 在普通窗口发送 Ctrl 加 C 或 V，在终端发送 Ctrl Shift 加 C 或 V。Zed 直接接收 Ctrl Shift 加 C 或 V。</desc>
  <defs>
    <style>text{font-family:system-ui,'Noto Sans CJK SC',sans-serif;fill:#e2e8f0}.h{font-size:27px;font-weight:700}.label{font-size:20px;font-weight:600}.small{font-size:16px;fill:#cbd5e1}.box{fill:#1e293b;stroke:#64748b;stroke-width:2}.arrow{fill:none;stroke:#38bdf8;stroke-width:3;marker-end:url(#a)}</style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="none" stroke="#38bdf8" stroke-width="2"/></marker>
  </defs>
  <rect width="1000" height="720" rx="20" fill="#0f172a"/>
  <text x="40" y="53" class="h">左 Alt + C / V：谁负责复制粘贴？</text>
  <text x="40" y="86" class="small">普通路径依赖 Omarchy 的 Super+C/V；Zed 使用专用键位</text>
  <rect x="330" y="115" width="340" height="65" rx="12" class="box"/><text x="370" y="155" class="label">物理左 Alt + C / V</text>
  <path d="M500 180V205H265V235M500 205H755V235" class="arrow"/>
  <rect x="65" y="245" width="400" height="90" rx="12" class="box"/><text x="90" y="280" class="label">base / terminal / editor</text><text x="90" y="310" class="small">Kanata 临时抑制 Ctrl → Super+C/V</text>
  <rect x="565" y="245" width="370" height="90" rx="12" class="box"/><text x="590" y="280" class="label">zed 专用层</text><text x="590" y="310" class="small">Kanata → Ctrl+Shift+C/V</text>
  <path d="M265 335V375" class="arrow"/><path d="M755 335V490" class="arrow"/>
  <rect x="65" y="385" width="400" height="80" rx="12" fill="#172554" stroke="#38bdf8" stroke-width="2"/><text x="90" y="418" class="label">Omarchy Universal copy/paste</text><text x="90" y="447" class="small">按窗口 terminal tag 判断终端</text>
  <path d="M265 465V485H140V515M265 485H385V515" class="arrow"/>
  <rect x="40" y="525" width="205" height="95" rx="12" class="box"/><text x="60" y="560" class="label">普通应用 / IDE</text><text x="60" y="594" class="small">Ctrl+C/V</text>
  <rect x="280" y="525" width="225" height="95" rx="12" class="box"/><text x="300" y="560" class="label">独立终端</text><text x="300" y="594" class="small">Ctrl+Shift+C/V</text>
  <rect x="565" y="500" width="370" height="120" rx="12" class="box"/><text x="590" y="536" class="label">Zed 直接处理</text><text x="590" y="568" class="small">编辑器：合并配套 keymap.json</text><text x="590" y="595" class="small">内置终端：自身的复制粘贴绑定</text>
  <text x="40" y="666" class="small">Omarchy 路径：缺少 Super+C/V 桌面绑定时，不会自动变成应用的复制粘贴。</text>
  <text x="40" y="693" class="small">图示为单独左 Alt+C/V；额外 Shift / Super 的处理及版本差异见 README。</text>
</svg>
